<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>The Last Stone - Lago</title>

    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/jogo.css">
</head>

<body>

    <div id="hud">

        <div id="vida-container">

            <div id="vida-info">
                <span>❤️ VIDA</span>
                <span id="vida-texto">100 / 100</span>
            </div>

            <div id="vida-fundo">
                <div id="vida-barra"></div>
            </div>

        </div>

    </div>


    <div id="hud-inimigo">

        <div id="inimigo-info">

            <h2 id="nome-inimigo">
                Lobo Glacial
            </h2>

        </div>

        <div id="vida-inimigo-fundo">

            <div id="vida-inimigo-barra"></div>

        </div>

    </div>


    <div id="jogo">

        <div id="cenario">

            <img
                src="../assets/cenarios/cenario-04-lago/lago.png"
                class="fundo-cenario"
                alt=""
            >

            <img
                id="personagem"
                class="personagem"
                src="../assets/personagens/cacador/animacoes/idle/idle-01.png"
                alt="Caçador"
            >

            <img
                id="inimigo-lobo-glacial"
                class="inimigo-lobo-glacial"
                src="../assets/personagens/inimigos/lobo-glacial/idle/idle-01.png"
                alt="Lobo Glacial"
            >

        </div>

    </div>


    <div id="dialogo">

        <div id="dialogo-personagem">
            Caçador
        </div>

        <div id="dialogo-texto">
            O caminho levou até um lago...
        </div>

        <div id="dialogo-continuar">
            Pressione E para continuar
        </div>

    </div>


    <div id="transicao"></div>


    <script src="../java-script/sistema/animacao.js"></script>
    <script src="../java-script/sistema/jogo.js"></script>
    <script src="../java-script/sistema/inimigo-lobo-glacial.js"></script>

</body>
</html>
